name: Release Spliit Cloud
run-name: Release ${{ github.ref_name }} (${{ github.sha }})

# Versioned releases. Push a `v*.*.*` tag to build, publish, create the
# GitHub Release from `releases/<tag>.md`, and deploy prod immediately.
# `main` pushes do nothing here; CI runs separately.
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag to rebuild and re-release (e.g. v2.0.0)'
        required: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  validate-notes:
    name: Validate release notes file
    runs-on: ubuntu-24.04-arm
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - name: Resolve tag
        id: resolve
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.resolve.outputs.tag }}
          fetch-depth: 1

      - name: Resolve commit SHA
        id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Check releases/<tag>.md exists
        run: |
          TAG="${{ steps.resolve.outputs.tag }}"
          if [ ! -f "releases/${TAG}.md" ]; then
            echo "::error::Missing releases/${TAG}.md. Cut the release with 'bun release:prepare ${TAG}' first — see .agents/skills/cut-release/SKILL.md."
            exit 1
          fi
          echo "Found releases/${TAG}.md"

      - name: Reject unfilled placeholders
        run: |
          TAG="${{ steps.resolve.outputs.tag }}"
          if grep -q '`TBD`' "releases/${TAG}.md"; then
            echo "::error::releases/${TAG}.md still contains unfilled \`TBD\` placeholders:"
            grep -n '`TBD`' "releases/${TAG}.md"
            exit 1
          fi
          echo "No placeholders left"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Validate announcement content
        run: |
          bun install --frozen-lockfile
          bun scripts/generate-announcement-content.ts --check
          bun i18n check

  # The tag push and the `main` push of the release commit fire CI and this
  # workflow in parallel. Block everything below until CI is green on the
  # exact tagged commit, so a single fire-and-forget
  # `git push origin main <tag>` can never publish or deploy a broken build.
  await-ci:
    name: Wait for CI on release commit
    needs: validate-notes
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 50
    permissions:
      actions: read
      contents: read
    steps:
      - name: Wait for CI workflow to succeed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ needs.validate-notes.outputs.sha }}
        run: |
          set -euo pipefail
          deadline=$(( $(date +%s) + 45*60 ))
          echo "Waiting for CI runs on ${SHA}..."
          while [ "$(date +%s)" -lt "$deadline" ]; do
            runs="$(gh run list --commit "$SHA" --workflow CI --limit 10 --json status,conclusion --repo "${{ github.repository }}")"
            total="$(printf '%s' "$runs" | jq 'length')"
            if [ "$total" -eq 0 ]; then
              echo "No CI run found yet, retrying in 30s..."
              sleep 30
              continue
            fi
            failures="$(printf '%s' "$runs" | jq '[.[] | select(.status == "completed" and .conclusion != "success")] | length')"
            if [ "$failures" -gt 0 ]; then
              echo "::error::CI failed for ${SHA} — refusing to release:"
              printf '%s' "$runs" | jq .
              exit 1
            fi
            pending="$(printf '%s' "$runs" | jq '[.[] | select(.status != "completed")] | length')"
            if [ "$pending" -eq 0 ]; then
              echo "CI is green for ${SHA}."
              exit 0
            fi
            echo "CI still running (${pending} pending), retrying in 30s..."
            sleep 30
          done
          echo "::error::Timed out after 45m waiting for CI on ${SHA}. Push the release commit to main first, then re-run."
          exit 1

  # Backend images share the `pruner → installer → prisma` stages in
  # Dockerfile. Building api/migrate/worker/mcp sequentially on one runner
  # per arch keeps those stages (plus the Bun install cache mount) warm in
  # the local BuildKit cache instead of rebuilding them in isolated jobs.
  # The shared `backend-<arch>` GHA scope preserves that sharing across
  # runs; per-image registry caches plus the previous per-app GHA scopes
  # warm the first runs after this restructure.
  build-backend:
    name: Build backend (${{ matrix.arch }})
    needs: [validate-notes, await-ci]
    runs-on: ${{ matrix.arch == 'amd64' && 'ubuntu-24.04' || 'ubuntu-24.04-arm' }}
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.validate-notes.outputs.tag }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve repository prefix
        id: repo
        run: |
          prefix="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          echo "prefix=${prefix}" >> "$GITHUB_OUTPUT"

      - name: Extract api metadata
        id: meta-api
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ steps.repo.outputs.prefix }}/spliit-cloud-api
          tags: |
            type=raw,value=${{ needs.validate-notes.outputs.tag }},suffix=-${{ matrix.arch }}

      - name: Build and push api
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          target: api
          platforms: linux/${{ matrix.arch }}
          build-args: |
            APP_SCOPE=@spliit/api
          push: true
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}
          provenance: false
          sbom: false
          cache-from: |
            type=gha,scope=backend-${{ matrix.arch }}
            type=gha,scope=api-${{ matrix.arch }}
            type=registry,ref=${{ env.REGISTRY }}/${{ steps.repo.outputs.prefix }}/spliit-cloud-api:buildcache-${{ matrix.arch }}
          cache-to: |
            type=gha,mode=max,scope=backend-${{ matrix.arch }}
            type=registry,ref=${{ env.REGISTRY }}/${{ steps.repo.outputs.prefix }}/spliit-cloud-api:buildcache-${{ matrix.arch }},mode=max

      - name: Extract migrate metadata
        id: meta-migrate
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ steps.repo.outputs.prefix }}/spliit-cloud-migrate
          tags: |
            type=raw,value=${{ needs.validate-notes.outputs.tag }},suffix=-${{ matrix.arch }}

      - name: Build and push migrate
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          target: migrate
          platforms: linux/${{ matrix.arch }}
          build-args: |
            APP_SCOPE=@spliit/db
          push: true
          tags: ${{ steps.meta-migrate.outputs.tags }}
          labels: ${{ steps.meta-migrate.outputs.labels }}
          provenance: false
          sbom: false
          cache-from: |
            type=gha,scope=backend-${{ matrix.arch }}
            type=gha,scope=migrate-${{ matrix.arch }}
            type=registry,ref=${{ env.REGISTRY }}/${{ steps.repo.outputs.prefix }}/spliit-cloud-migrate:buildcache-${{ matrix.arch }}
          cache-to: |
            type=gha,mode=max,scope=backend-${{ matrix.arch }}
            type=registry,ref=${{ env.REGISTRY }}/${{ steps.repo.outputs.prefix }}/spliit-cloud-migrate:buildcache-${{ matrix.arch }},mode=max

      - name: Extract worker metadata
        id: meta-worker
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ steps.repo.outputs.prefix }}/spliit-cloud-worker
          tags: |
            type=raw,value=${{ needs.validate-notes.outputs.tag }},suffix=-${{ matrix.arch }}

      - name: Build and push worker
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          target: worker
          platforms: linux/${{ matrix.arch }}
          build-args: |
            APP_SCOPE=@spliit/worker
          push: true
          tags: ${{ steps.meta-worker.outputs.tags }}
          labels: ${{ steps.meta-worker.outputs.labels }}
          provenance: false
          sbom: false
          cache-from: |
            type=gha,scope=backend-${{ matrix.arch }}
            type=gha,scope=worker-${{ matrix.arch }}
            type=registry,ref=${{ env.REGISTRY }}/${{ steps.repo.outputs.prefix }}/spliit-cloud-worker:buildcache-${{ matrix.arch }}
          cache-to: |
            type=gha,mode=max,scope=backend-${{ matrix.arch }}
            type=registry,ref=${{ env.REGISTRY }}/${{ steps.repo.outputs.prefix }}/spliit-cloud-worker:buildcache-${{ matrix.arch }},mode=max

      - name: Extract mcp metadata
        id: meta-mcp
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ steps.repo.outputs.prefix }}/spliit-cloud-mcp
          tags: |
            type=raw,value=${{ needs.validate-notes.outputs.tag }},suffix=-${{ matrix.arch }}

      - name: Build and push mcp
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          target: mcp
          platforms: linux/${{ matrix.arch }}
          build-args: |
            APP_SCOPE=@spliit/mcp
          push: true
          tags: ${{ steps.meta-mcp.outputs.tags }}
          labels: ${{ steps.meta-mcp.outputs.labels }}
          provenance: false
          sbom: false
          cache-from: |
            type=gha,scope=backend-${{ matrix.arch }}
            type=gha,scope=mcp-${{ matrix.arch }}
            type=registry,ref=${{ env.REGISTRY }}/${{ steps.repo.outputs.prefix }}/spliit-cloud-mcp:buildcache-${{ matrix.arch }}
          cache-to: |
            type=gha,mode=max,scope=backend-${{ matrix.arch }}
            type=registry,ref=${{ env.REGISTRY }}/${{ steps.repo.outputs.prefix }}/spliit-cloud-mcp:buildcache-${{ matrix.arch }},mode=max

  # The web `dist/` output is architecture-independent (Dockerfile.web
  # compiles on $BUILDPLATFORM), so a single multi-platform build replaces
  # the previous two per-arch Vite builds. QEMU only packages the static
  # files into each arch's nginx base — no compilation under emulation.
  # This job pushes the `:TAG` / `:latest` multi-arch manifest directly, so
  # it is not part of merge-backend below.
  build-web:
    name: Build web (multi-arch)
    needs: [validate-notes, await-ci]
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.validate-notes.outputs.tag }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image name
        id: image
        run: |
          image_name="${{ github.repository_owner }}/spliit-cloud-web"
          echo "name=${image_name,,}" >> "$GITHUB_OUTPUT"

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=${{ needs.validate-notes.outputs.tag }}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.web
          target: web
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          sbom: false
          cache-from: |
            type=gha,scope=web
            type=gha,scope=web-arm64
            type=registry,ref=${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:buildcache
            type=registry,ref=${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:buildcache-arm64
            type=registry,ref=${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:buildcache-amd64
          cache-to: |
            type=gha,mode=max,scope=web
            type=registry,ref=${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:buildcache,mode=max

  merge-backend:
    name: Publish ${{ matrix.app }} multi-arch manifest
    needs: [validate-notes, build-backend]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: api
            image: spliit-cloud-api
          - app: migrate
            image: spliit-cloud-migrate
          - app: worker
            image: spliit-cloud-worker
          - app: mcp
            image: spliit-cloud-mcp
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image name
        id: image
        run: |
          image_name="${{ github.repository_owner }}/${{ matrix.image }}"
          echo "name=${image_name,,}" >> "$GITHUB_OUTPUT"

      # Only two floating tags exist: the immutable version and `latest`
      # (stable). No SHA, major/minor, or RC channels.
      - name: Create multi-arch manifests
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}
          TAG: ${{ needs.validate-notes.outputs.tag }}
        run: |
          docker buildx imagetools create \
            --tag "${IMAGE}:${TAG}" \
            --tag "${IMAGE}:latest" \
            "${IMAGE}:${TAG}-amd64" \
            "${IMAGE}:${TAG}-arm64"
          docker buildx imagetools inspect "${IMAGE}:${TAG}"
          docker buildx imagetools inspect "${IMAGE}:latest"

  deploy-relay-worker:
    name: Deploy webhook relay worker
    needs: [validate-notes, await-ci]
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.validate-notes.outputs.tag }}
          fetch-depth: 1

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Ships worker code only; RELAY_SECRET persists across deploys and is
      # managed separately via `wrangler secret put` (see docs/webhooks.md).
      - name: Deploy relay worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: apps/webhook-relay
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is not configured. Add a repo secret with a Cloudflare API token able to deploy Workers scripts (Workers Scripts:Edit)."
            exit 1
          fi
          bun run deploy

  create-release:
    name: Create GitHub Release
    needs: [validate-notes, merge-backend, build-web]
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.validate-notes.outputs.tag }}
          fetch-depth: 1

      - name: Build notes from releases/<tag>.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.validate-notes.outputs.tag }}
        run: |
          set -euo pipefail
          NOTES_FILE="releases/${TAG}.md"
          if [ ! -f "$NOTES_FILE" ]; then
            echo "::error::Missing $NOTES_FILE"
            exit 1
          fi

          cp "$NOTES_FILE" /tmp/notes.md

          # Rewrite relative screenshot links `./assets/...` (relative to
          # `releases/`) to absolute tagged blob URLs so they render on the
          # Releases page and stay pinned to this tag. Handles both Markdown
          # image syntax `](...)` and HTML `<img src="...">` (used for
          # sized screenshots in Highlights).
          # (`-i.bak` keeps this working on both GNU and BSD sed.)
          sed -i.bak "s#](\./assets/#](https://github.com/${{ github.repository }}/blob/${TAG}/releases/assets/#g" /tmp/notes.md
          sed -i.bak "s#src=\"\./assets/#src=\"https://github.com/${{ github.repository }}/blob/${TAG}/releases/assets/#g" /tmp/notes.md
          sed -i.bak "s#src='\./assets/#src='https://github.com/${{ github.repository }}/blob/${TAG}/releases/assets/#g" /tmp/notes.md
          rm -f /tmp/notes.md.bak

          # Append Docker image pointers. `:latest` always equals this
          # stable version.
          {
            echo ""
            echo "---"
            echo "### 🐳 Docker images for this release"
            echo ""
            repo_lc=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
            for img in spliit-cloud-api spliit-cloud-migrate spliit-cloud-worker spliit-cloud-mcp spliit-cloud-web; do
              echo "- \`ghcr.io/${repo_lc}/${img}:${TAG}\` (also available as \`:latest\`)"
            done
            echo ""
            echo "> Pin with \`SPLIIT_TAG=${TAG}\` or follow stable with \`SPLIIT_TAG=latest\` — see \`compose.yaml\`"
          } >> /tmp/notes.md

          cat /tmp/notes.md

          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release $TAG already exists, updating notes..."
            gh release edit "$TAG" --notes-file /tmp/notes.md --repo "${{ github.repository }}"
          else
            # Target a branch, not a SHA: the API rejects a tag name as
            # target_commitish (422), and full SHAs 404 as of 2026-09-29.
            # The value is unused when the tag already exists (always true
            # here — the tag is pushed before this workflow runs), so the
            # default branch is the safe choice.
            gh release create "$TAG" --target main --title "$TAG" --notes-file /tmp/notes.md --latest --repo "${{ github.repository }}"
          fi

          echo "Done: $TAG"

  deploy-dokploy:
    name: Trigger Dokploy deploy
    needs: [merge-backend, create-release, deploy-relay-worker]
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Trigger Dokploy compose deploy
        env:
          DOKPLOY_URL: ${{ vars.DOKPLOY_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          DOKPLOY_COMPOSE_ID: ${{ vars.DOKPLOY_COMPOSE_ID }}
          DOKPLOY_CF_BYPASS_SECRET: ${{ secrets.DOKPLOY_CF_BYPASS_SECRET }}
        run: |
          if [ -z "$DOKPLOY_URL" ] || [ -z "$DOKPLOY_API_KEY" ] || [ -z "$DOKPLOY_COMPOSE_ID" ] || [ -z "$DOKPLOY_CF_BYPASS_SECRET" ]; then
            echo "Dokploy deploy secrets are not fully configured."
            echo "Required values: DOKPLOY_URL, DOKPLOY_COMPOSE_ID, DOKPLOY_API_KEY, DOKPLOY_CF_BYPASS_SECRET."
            exit 1
          fi

          response="$(curl -sS -w '\n%{http_code}' -X POST "${DOKPLOY_URL%/}/api/compose.deploy" \
            -H "accept: application/json" \
            -H "content-type: application/json" \
            -H "x-api-key: $DOKPLOY_API_KEY" \
            -H "x-dokploy-ci-token: $DOKPLOY_CF_BYPASS_SECRET" \
            -d "{\"composeId\":\"$DOKPLOY_COMPOSE_ID\"}")"

          status="$(printf '%s' "$response" | tail -n1)"
          body="$(printf '%s' "$response" | sed '$d')"

          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "Dokploy deploy request failed with HTTP $status."
            echo "$body"
            exit 1
          fi

          echo "$body"

  deploy-pages:
    name: Trigger Cloudflare Pages deploy
    needs: [create-release]
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Trigger CF Pages deploy
        env:
          CF_PAGES_DEPLOY_HOOK_URL: ${{ secrets.CF_PAGES_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$CF_PAGES_DEPLOY_HOOK_URL" ]; then
            echo "CF_PAGES_DEPLOY_HOOK_URL is not configured."
            exit 1
          fi

          curl -fsS -X POST "$CF_PAGES_DEPLOY_HOOK_URL"
