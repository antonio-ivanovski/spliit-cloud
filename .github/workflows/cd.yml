name: Create and publish Docker images

on:
  push:
    tags:
      - '*'

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push-image:
    name: Build ${{ matrix.app }} (${{ matrix.arch }})
    runs-on: ${{ matrix.arch == 'amd64' && 'ubuntu-24.04' || 'ubuntu-24.04-arm' }}
    strategy:
      fail-fast: false
      matrix:
        app: [api, migrate, worker, mcp, web]
        arch: [amd64, arm64]
        include:
          - app: api
            scope: '@spliit/api'
            file: Dockerfile
            target: api
            image: spliit-cloud-api
          - app: migrate
            scope: '@spliit/db'
            file: Dockerfile
            target: migrate
            image: spliit-cloud-migrate
          - app: worker
            scope: '@spliit/worker'
            file: Dockerfile
            target: worker
            image: spliit-cloud-worker
          - app: mcp
            scope: '@spliit/mcp'
            file: Dockerfile
            target: mcp
            image: spliit-cloud-mcp
          - app: web
            scope: '@spliit/web'
            file: Dockerfile.web
            target: web
            image: spliit-cloud-web
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image name
        id: image
        run: |
          image_name="${{ github.repository_owner }}/${{ matrix.image }}"
          echo "name=${image_name,,}" >> "$GITHUB_OUTPUT"

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=tag,suffix=-${{ matrix.arch }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          platforms: linux/${{ matrix.arch }}
          build-args: |
            APP_SCOPE=${{ matrix.scope }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          sbom: false
          cache-from: |
            type=gha,scope=cd-${{ matrix.app }}-${{ matrix.arch }}
            type=registry,ref=${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:buildcache-${{ matrix.arch }}
          cache-to: |
            type=gha,mode=max,scope=cd-${{ matrix.app }}-${{ matrix.arch }}
            type=registry,ref=${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:buildcache-${{ matrix.arch }},mode=max

  merge-images:
    name: Publish ${{ matrix.app }} multi-arch manifest
    needs: build-and-push-image
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: api
            image: spliit-cloud-api
          - app: migrate
            image: spliit-cloud-migrate
          - app: worker
            image: spliit-cloud-worker
          - app: mcp
            image: spliit-cloud-mcp
          - app: web
            image: spliit-cloud-web
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image name
        id: image
        run: |
          image_name="${{ github.repository_owner }}/${{ matrix.image }}"
          echo "name=${image_name,,}" >> "$GITHUB_OUTPUT"

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=tag

      - name: Create multi-arch manifest
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            docker buildx imagetools create \
              --tag "$tag" \
              "${tag}-amd64" \
              "${tag}-arm64"
            docker buildx imagetools inspect "$tag"
          done <<< "$TAGS"
