name: CI

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

jobs:
  checks:
    runs-on: ubuntu-24.04-arm
    env:
      DATABASE_URL: postgresql://postgres:1234@localhost
      VITE_DEFAULT_CURRENCY_CODE: USD
      INTEGRATION_API_URL: http://localhost:3101

      # SMTP (MailDev) — integration tests + API server need these to deliver mail
      SMTP_HOST: localhost
      SMTP_PORT: '1025'
      SMTP_USER: ''
      SMTP_PASS: ''
      EMAIL_FROM: 'Spliit Cloud CI <no-reply@spliit.local>'

      # S3 (MaxIO) — API server reads these on boot
      S3_UPLOAD_BUCKET: spliit-local
      S3_UPLOAD_KEY: maxioadmin
      S3_UPLOAD_SECRET: maxioadmin
      S3_UPLOAD_REGION: us-east-1
      S3_UPLOAD_ENDPOINT: 'http://localhost:9000'
      S3_UPLOAD_PUBLIC_URL: 'http://localhost:9000/spliit-local'

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: 1234
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        # Wait for postgres to be ready
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      maildev:
        image: maildev/maildev:2.2.1
        ports:
          - 1080:1080
          - 1025:1025
        options: >-
          --health-cmd "wget -q --tries=1 --spider http://localhost:1080/healthz || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      maxio:
        image: ghcr.io/coollabsio/maxio:0.4.2
        env:
          MAXIO_DEFAULT_BUCKETS: spliit-local
          MAXIO_ALLOW_INSECURE_DEV: 'true'
          MAXIO_SECURE_COOKIES: 'false'
        ports:
          - 9000:9000
        options: >-
          --health-cmd "maxio healthcheck --url http://127.0.0.1:9000/healthz"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Cache Bun install
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-${{ runner.arch }}-

      - name: Cache Turbo
        uses: actions/cache@v5
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ runner.arch }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Audit translations
        run: bun i18n check

      - name: Check formatting, lint, and TypeScript types
        run: bun run check

      - name: Build
        run: bun run build

      - name: Validate self-hosting Compose files
        env:
          POSTGRES_PASSWORD: test-password
          APP_URL: https://spliit.example.com
          BETTER_AUTH_SECRET: test-better-auth-secret
          SMTP_HOST: smtp.example.com
          EMAIL_FROM: noreply@example.com
          EMAIL_UNSUBSCRIBE_SECRET: 12345678901234567890123456789012
        run: |
          docker compose -f compose.yaml config --quiet
          docker compose -f compose.yaml -f compose.api-port.yaml config --quiet
          docker compose -f compose.yaml -f compose.build.yaml config --quiet
          WEB_ORIGINS=https://web.example.com \
            BETTER_AUTH_URL=https://api.example.com \
            docker compose -f compose.yaml config --format json \
            > /tmp/spliit-split-compose.json
          jq -e '
            .services.api.environment.WEB_ORIGINS == "https://web.example.com" and
            .services.api.environment.BETTER_AUTH_URL == "https://api.example.com" and
            .services.worker.environment.WEB_ORIGINS == "https://web.example.com" and
            .services.worker.environment.BETTER_AUTH_URL == "https://api.example.com"
          ' /tmp/spliit-split-compose.json
          docker run --rm \
            --add-host api:127.0.0.1 \
            -v "$PWD/nginx.web.conf:/etc/nginx/conf.d/default.conf:ro" \
            nginx:1.27-alpine nginx -t

      - name: Generate OpenAPI spec
        env:
          ENABLE_MCP: 'true'
          MCP_PUBLIC_URL: https://mcp-build.invalid
          ASSISTANT_CONFIRMATION_SECRET: assistant-build-secret-at-least-32-bytes
        run: bun run --filter @spliit/api generate-openapi

      - name: Run tests
        run: bun run test

      - name: Run Prisma migrations
        run: bun run prisma-migrate

      - name: Run integration tests
        run: |
          set -e

          # Web integration tests probe http://localhost:3101/health at
          # module load time and throw if the API is not running, so we
          # start the API server here and wait for it to respond.
          echo "Starting API server in the background..."
          bun --filter @spliit/api start:integration > /tmp/api-server.log 2>&1 &
          API_PID=$!

          cleanup() {
            kill "$API_PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          echo "Waiting for API server on http://localhost:3101/health..."
          for i in {1..60}; do
            if curl -s -f http://localhost:3101/health > /dev/null; then
              echo "API server is ready after ${i}s"
              break
            fi
            sleep 1
          done

          if ! curl -s -f http://localhost:3101/health > /dev/null; then
            echo "::error::API server failed to become ready within 60s"
            echo "--- API server log ---"
            cat /tmp/api-server.log
            exit 1
          fi

          bun run test:integration
