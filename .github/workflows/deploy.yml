name: Deploy Spliit Cloud
run-name: ${{ github.event.workflow_run.display_title || github.event.head_commit.message || github.event_name }} - ${{ github.event.workflow_run.head_sha || github.sha }}

# Runs after the CI workflow completes successfully on main. PRs against main
# do not trigger this workflow; a failed CI run on main also aborts it.
on:
  workflow_run:
    workflows:
      - CI
    branches:
      - main
    types:
      - completed

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  build-and-push:
    name: Build ${{ matrix.app }} (${{ matrix.arch }})
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ${{ matrix.arch == 'amd64' && 'ubuntu-24.04' || 'ubuntu-24.04-arm' }}
    strategy:
      fail-fast: false
      matrix:
        app: [api, migrate, worker, mcp, web]
        arch: [amd64, arm64]
        include:
          - app: api
            scope: '@spliit/api'
            file: Dockerfile
            target: api
            image: spliit-cloud-api
          - app: migrate
            scope: '@spliit/db'
            file: Dockerfile
            target: migrate
            image: spliit-cloud-migrate
          - app: worker
            scope: '@spliit/worker'
            file: Dockerfile
            target: worker
            image: spliit-cloud-worker
          - app: mcp
            scope: '@spliit/mcp'
            file: Dockerfile
            target: mcp
            image: spliit-cloud-mcp
          - app: web
            scope: '@spliit/web'
            file: Dockerfile.web
            target: web
            image: spliit-cloud-web
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # workflow_run default checks out the workflow file's SHA on the
          # default branch; we want the exact commit CI tested.
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image name
        id: image
        run: |
          image_name="${{ github.repository_owner }}/${{ matrix.image }}"
          echo "name=${image_name,,}" >> "$GITHUB_OUTPUT"

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=${{ github.event.workflow_run.head_sha }},suffix=-${{ matrix.arch }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          platforms: linux/${{ matrix.arch }}
          build-args: |
            APP_SCOPE=${{ matrix.scope }}
            VITE_BUILD_SHA=${{ github.event.workflow_run.head_sha }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          sbom: false
          cache-from: |
            type=gha,scope=${{ matrix.app }}-${{ matrix.arch }}
            type=registry,ref=${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:buildcache-${{ matrix.arch }}
          cache-to: |
            type=gha,mode=max,scope=${{ matrix.app }}-${{ matrix.arch }}
            type=registry,ref=${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:buildcache-${{ matrix.arch }},mode=max

  merge-images:
    name: Publish ${{ matrix.app }} multi-arch manifest
    needs: build-and-push
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: api
            image: spliit-cloud-api
          - app: migrate
            image: spliit-cloud-migrate
          - app: worker
            image: spliit-cloud-worker
          - app: mcp
            image: spliit-cloud-mcp
          - app: web
            image: spliit-cloud-web
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image name
        id: image
        run: |
          image_name="${{ github.repository_owner }}/${{ matrix.image }}"
          echo "name=${image_name,,}" >> "$GITHUB_OUTPUT"

      - name: Create multi-arch manifests
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          docker buildx imagetools create \
            --tag "${IMAGE}:${SHA}" \
            --tag "${IMAGE}:latest" \
            "${IMAGE}:${SHA}-amd64" \
            "${IMAGE}:${SHA}-arm64"
          docker buildx imagetools inspect "${IMAGE}:${SHA}"
          docker buildx imagetools inspect "${IMAGE}:latest"

  create-release:
    name: Create GitHub Release (SHA → rolling)
    needs: merge-images
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write
    if: github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Create SHA release + update rolling release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          SHORT_SHA="${SHA:0:7}"
          TAG="sha-${SHA}"
          TITLE="rolling $SHORT_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Generate notes via GitHub API so we can inject Docker links.
          # Use last semver tag as previous_tag_name so rolling notes stay
          # cumulative since the last stable 1.x release.
          PREV_TAG=$(git describe --tags --match "1.*" --abbrev=0 2>/dev/null || git describe --tags --abbrev=0 2>/dev/null || echo "")
          echo "Previous tag: ${PREV_TAG:-<none>}"
          if [ -n "$PREV_TAG" ]; then
            gh api "repos/${{ github.repository }}/releases/generate-notes" \
              -f tag_name="$TAG" -f target_commitish="$SHA" -f previous_tag_name="$PREV_TAG" --jq .body > /tmp/notes.md
          else
            gh api "repos/${{ github.repository }}/releases/generate-notes" \
              -f tag_name="$TAG" -f target_commitish="$SHA" --jq .body > /tmp/notes.md
          fi

          # Append Docker image pointers (links SHA directly to GHCR)
          {
            echo ""
            echo "---"
            echo "### 🐳 Docker images for this commit"
            echo ""
            repo_lc=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
            for img in spliit-cloud-api spliit-cloud-migrate spliit-cloud-worker spliit-cloud-mcp spliit-cloud-web; do
              echo "- \`ghcr.io/${repo_lc}/${img}:${SHA}\` \`(${SHORT_SHA})\`"
            done
            echo "- also available as \`:latest\` (rolling)"
            echo ""
            echo "> Pin with \`SPLIIT_TAG=${SHA}\` or follow rolling with \`SPLIIT_TAG=latest\` — see \`compose.yaml\`"
          } >> /tmp/notes.md

          cat /tmp/notes.md

          # 1) Immutable per-commit release: tag = full SHA (version = git SHA, 1:1 with GHCR :SHA)
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release $TAG already exists, updating notes..."
            gh release edit "$TAG" --notes-file /tmp/notes.md --repo "${{ github.repository }}"
          else
            gh release create "$TAG" --target "$SHA" --title "$TITLE" --notes-file /tmp/notes.md --repo "${{ github.repository }}"
          fi

          # 2) Rolling evergreen release: tag = 'rolling' (moves every commit, keeps 1 entry on Releases page)
          #    Points at same SHA, body is the same cumulative notes. Self-hosters can watch this one release.
          if gh release view rolling --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release edit rolling --title "Rolling ($SHORT_SHA)" --notes-file /tmp/notes.md --repo "${{ github.repository }}"
            git tag -f rolling "$SHA"
            git push -f origin rolling
          else
            gh release create rolling --target "$SHA" --title "Rolling ($SHORT_SHA)" --notes-file /tmp/notes.md --repo "${{ github.repository }}"
          fi

          echo "Done: $TAG + rolling updated"

  deploy-dokploy:
    name: Trigger Dokploy deploy
    needs: [merge-images, create-release]
    if: always() && needs.merge-images.result == 'success'
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Trigger Dokploy compose deploy
        env:
          DOKPLOY_URL: ${{ vars.DOKPLOY_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          DOKPLOY_COMPOSE_ID: ${{ vars.DOKPLOY_COMPOSE_ID }}
          DOKPLOY_CF_BYPASS_SECRET: ${{ secrets.DOKPLOY_CF_BYPASS_SECRET }}
        run: |
          if [ -z "$DOKPLOY_URL" ] || [ -z "$DOKPLOY_API_KEY" ] || [ -z "$DOKPLOY_COMPOSE_ID" ] || [ -z "$DOKPLOY_CF_BYPASS_SECRET" ]; then
            echo "Dokploy deploy secrets are not fully configured."
            echo "Required values: DOKPLOY_URL, DOKPLOY_COMPOSE_ID, DOKPLOY_API_KEY, DOKPLOY_CF_BYPASS_SECRET."
            exit 1
          fi

          response="$(curl -sS -w '\n%{http_code}' -X POST "${DOKPLOY_URL%/}/api/compose.deploy" \
            -H "accept: application/json" \
            -H "content-type: application/json" \
            -H "x-api-key: $DOKPLOY_API_KEY" \
            -H "x-dokploy-ci-token: $DOKPLOY_CF_BYPASS_SECRET" \
            -d "{\"composeId\":\"$DOKPLOY_COMPOSE_ID\"}")"

          status="$(printf '%s' "$response" | tail -n1)"
          body="$(printf '%s' "$response" | sed '$d')"

          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "Dokploy deploy request failed with HTTP $status."
            echo "$body"
            exit 1
          fi

          echo "$body"

  deploy-pages:
    name: Trigger Cloudflare Pages deploy
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Trigger CF Pages deploy
        env:
          CF_PAGES_DEPLOY_HOOK_URL: ${{ secrets.CF_PAGES_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$CF_PAGES_DEPLOY_HOOK_URL" ]; then
            echo "CF_PAGES_DEPLOY_HOOK_URL is not configured."
            exit 1
          fi

          curl -fsS -X POST "$CF_PAGES_DEPLOY_HOOK_URL"
