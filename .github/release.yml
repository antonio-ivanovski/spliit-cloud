# Auto-generated release notes config (used by `gh release create --generate-notes`
# and the GitHub Releases UI "Generate release notes" button).
# See https://docs.github.com/en/repositories/releasing-projects-on-github/automatically-generated-release-notes

changelog:
  exclude:
    labels:
      - skip-changelog
      - dependencies
    authors:
      - dependabot[bot]
      - renovate[bot]
  categories:
    - title: 🚀 Features
      labels:
        - feature
        - feat
        - enhancement
    - title: 🐛 Fixes
      labels:
        - fix
        - bug
        - bugfix
    - title: 🔒 Security
      labels:
        - security
    - title: 🧹 Chores & Maintenance
      labels:
        - chore
        - dependencies
    - title: 📚 Documentation
      labels:
        - docs
        - documentation
    - title: 📦 Other Changes
      labels:
        - '*'
