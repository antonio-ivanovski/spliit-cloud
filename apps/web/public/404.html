<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Page not found - Spliit Cloud</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1rem;
        font-family:
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
        background: #f8fafc;
        color: #0f172a;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #020617;
          color: #f1f5f9;
        }
      }
      .card {
        text-align: center;
        max-width: 28rem;
        border: 1px solid #e2e8f0;
        border-radius: 0.75rem;
        background: #ffffff;
        padding: 2.5rem 1.5rem;
      }
      @media (prefers-color-scheme: dark) {
        .card {
          border-color: #1e293b;
          background: #0f172a;
        }
      }
      h1 {
        margin: 0;
        font-size: 1.125rem;
        font-weight: 600;
      }
      p {
        margin: 0.5rem 0 0;
        font-size: 0.875rem;
        color: #64748b;
      }
      a {
        display: inline-block;
        margin-top: 1rem;
        font-size: 0.875rem;
        font-weight: 500;
        color: inherit;
        text-decoration: none;
        border: 1px solid #e2e8f0;
        border-radius: 0.375rem;
        padding: 0.5rem 1rem;
      }
      @media (prefers-color-scheme: dark) {
        a {
          border-color: #334155;
        }
      }
      a:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>Page not found</h1>
      <p>
        The page you&#8217;re looking for doesn&#8217;t exist or has been moved.
      </p>
      <a href="/">Go to home</a>
    </main>
  </body>
</html>
